name: Flutter Android CI

on:
  push:
    branches: [main, feature/read-only-sheet-sync, fix/durable-transaction-retry, ui/black-gold-luxury-final]
  pull_request:
    branches: [main, test/pdf-qr-layout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate branded Android launcher icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Validate Google Sign-In build configuration
        env:
          OL_GOOGLE_WEB_CLIENT_ID: ${{ vars.OL_GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$OL_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::Set the repository variable OL_GOOGLE_WEB_CLIENT_ID to the public Google OAuth Web Client ID before building a usable tester APK."
            exit 1
          fi
      - name: Build release APK
        env:
          OL_GOOGLE_WEB_CLIENT_ID: ${{ vars.OL_GOOGLE_WEB_CLIENT_ID }}
        run: flutter build apk --release --dart-define=OL_GOOGLE_WEB_CLIENT_ID="$OL_GOOGLE_WEB_CLIENT_ID"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: optik-lentera-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
