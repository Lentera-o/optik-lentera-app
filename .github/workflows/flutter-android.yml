name: Flutter Android CI

on:
  push:
    branches: [main, ui-refresh-lentera]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate branded Android launcher icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/optik-lentera-upload.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            {
              echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Persistent OPTIK LENTERA signing key configured."
          else
            echo "Signing secrets not configured; this build will use temporary debug signing."
          fi
      - name: Build release APK
        env:
          OL_API_TOKEN: ${{ secrets.OL_API_TOKEN }}
        run: |
          if [ -z "$OL_API_TOKEN" ]; then
            echo "::warning::OL_API_TOKEN secret is not configured; this APK will not sync transactions to Google Sheets."
          fi
          flutter build apk --release --dart-define=OL_API_TOKEN="$OL_API_TOKEN"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: optik-lentera-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
