name: Flutter Android CI

on:
  push:
    branches: [main, feature/read-only-sheet-sync]
  pull_request:
    branches: [main, test/pdf-qr-layout]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate branded Android launcher icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: optik-lentera-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Publish public beta APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/read-only-sheet-sync'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-latest
          name: OPTIK LENTERA - Beta Testing
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
