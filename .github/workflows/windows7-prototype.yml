name: Build OPTIK LENTERA Windows 7 Prototype
on:
  workflow_dispatch:
  push:
    branches:
      - windows7-prototype
    paths:
      - 'windows7-prototype/**'
      - '.github/workflows/windows7-prototype.yml'
permissions:
  contents: read
jobs:
  build-wpf:
    runs-on: windows-latest
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build WPF application
        run: msbuild windows7-prototype/OptikLentera.Win7.csproj /p:Configuration=Release /p:Platform=AnyCPU /m
      - name: Package prototype
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item windows7-prototype/bin/Release/OPTIK-LENTERA.exe package/
          Compress-Archive -Path package/* -DestinationPath OPTIK-LENTERA-Win7-Prototipe.zip -Force
      - name: Upload prototype
        uses: actions/upload-artifact@v4
        with:
          name: OPTIK-LENTERA-Win7-Prototipe
          path: OPTIK-LENTERA-Win7-Prototipe.zip
          if-no-files-found: error
          retention-days: 14
