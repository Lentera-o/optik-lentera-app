name: Build OPTIK LENTERA Windows 7 Prototype
on:
  workflow_dispatch:
  push:
    branches:
      - windows7-prototype
    paths:
      - 'windows7-prototype/**'
      - '.github/workflows/windows7-prototype.yml'
permissions:
  contents: read
jobs:
  build-wpf:
    runs-on: windows-latest
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
      - name: Build WPF application
        shell: pwsh
        run: |
          $msbuild = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe','C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe','C:\Program Files\Microsoft Visual Studio\2022\Professional\MSBuild\Current\Bin\MSBuild.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found on this runner.' }
          & $msbuild.FullName windows7-prototype/OptikLentera.Win7.csproj /p:Configuration=Release /p:Platform=AnyCPU /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package prototype
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item windows7-prototype/bin/Release/OPTIK-LENTERA.exe package/
          Compress-Archive -Path package/* -DestinationPath OPTIK-LENTERA-Win7-Prototipe.zip -Force
      - name: Upload prototype
        uses: actions/upload-artifact@v4
        with:
          name: OPTIK-LENTERA-Win7-Prototipe
          path: OPTIK-LENTERA-Win7-Prototipe.zip
          if-no-files-found: error
          retention-days: 14
