name: Build OPTIK LENTERA Windows 7 Prototype
run-name: Build OPTIK LENTERA Invoice Reports - ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches:
      - windows7-prototype
      - win7-print-engine-rebuild
    paths:
      - 'windows7-prototype/**'
      - '.github/workflows/windows7-prototype.yml'
permissions:
  contents: write
jobs:
  build-wpf:
    runs-on: windows-latest
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet packages
        run: nuget restore windows7-prototype/packages.config -PackagesDirectory packages
      - name: Build WPF application
        run: msbuild windows7-prototype/OptikLentera.Win7.csproj /p:Configuration=Release /p:Platform=AnyCPU /m
      - name: Render and validate invoice, receipt, and prescription without a printer
        shell: pwsh
        run: |
          $output = "print-layout-proof"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & "windows7-prototype/bin/Release/OPTIK-LENTERA.exe" --print-layout-smoke $output
          if ($LASTEXITCODE -ne 0) { throw "Digital print-layout validation failed. See validation report." }
          if (!(Test-Path "$output/01-invoice.png") -or !(Test-Path "$output/02-kuitansi.png") -or !(Test-Path "$output/03-resep.png")) { throw "One or more digital document previews were not generated." }
      - name: Package portable prototype
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item windows7-prototype/bin/Release/* package/ -Recurse -Force
          if (!(Test-Path "package/QRCoder.dll")) { throw "QRCoder.dll missing from release output; QR preview and printing would fail." }
          Compress-Archive -Path package/* -DestinationPath OPTIK-LENTERA-Win7-Prototipe.zip -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "windows7-prototype/installer/OPTIK-LENTERA.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (!(Test-Path "windows7-prototype/installer-output/OPTIK-LENTERA-Setup-Windows7.exe")) { throw "Installer output missing." }
      - name: Publish direct EXE download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "win7-build-${{ github.run_number }}"
          gh release create $tag "windows7-prototype/installer-output/OPTIK-LENTERA-Setup-Windows7.exe" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "OPTIK LENTERA Windows 7 Installer" --notes "Installer Windows 7. Unduh file EXE pada bagian Assets."
      - name: Upload Windows installer and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OPTIK-LENTERA-Win7-Installer
          path: |
            windows7-prototype/installer-output/OPTIK-LENTERA-Setup-Windows7.exe
            OPTIK-LENTERA-Win7-Prototipe.zip
            print-layout-proof/*
          if-no-files-found: error
          retention-days: 14
